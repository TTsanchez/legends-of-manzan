<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LegendsOfManzan - С фоновыми объектами</title>
    <style>
        /* ============================================================
           База: canvas на весь экран, интерфейс — в DOM-слоях
           ============================================================ */
        * { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; background: #0b0b10;
            overflow: hidden; overscroll-behavior: none;
        }
        ::-webkit-scrollbar { display: none; }
        canvas { image-rendering: auto; }

        /* Скорость рядом со счётом */
        .hud__speed {
            margin-top: 3px;
            font: 700 10px/1 ui-monospace, Menlo, Consolas, monospace;
            font-style: normal;
            letter-spacing: 0.02em;
            color: #ff9b63;
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 430px) {
            .hud__actions { gap: 4px; }
            .icon-btn { width: 34px; height: 34px; font-size: 14px; }
        }

        /* На телефоне в портрете по-прежнему просим повернуть экран:
           геймплей этого файла рассчитан на горизонталь. */
        @media (max-width: 768px) and (orientation: portrait) {
            body::before {
                content: "📱 ПОВЕРНИТЕ ТЕЛЕФОН В ГОРИЗОНТАЛЬНОЕ ПОЛОЖЕНИЕ 📱";
                position: fixed; inset: 0;
                background: #000; color: #fff;
                display: flex; align-items: center; justify-content: center;
                text-align: center; font: 700 1.05rem/1.5 ui-monospace, monospace;
                padding: 24px; z-index: 9999;
            }
        }

/* ============================================================
   Legends of Manzan — оболочка интерфейса
   Игра рисуется на canvas, UI — обычный DOM (доступность, зум).
   ============================================================ */

:root {
    --gold: #ffce5c;
    --orange: #ff7a2f;
    --cream: #fff6e5;
    --ink: #14100b;
    --panel: rgba(16, 13, 10, 0.82);
    --line: rgba(255, 255, 255, 0.12);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #0b0b10;
    color: var(--cream);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: pointer;
}

[hidden] {
    display: none !important;
}

/* ---------------- HUD ---------------- */

.hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    padding: calc(10px + var(--safe-t)) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));
    pointer-events: none;
}

.hud__stat {
    display: flex;
    flex-direction: column;
    min-width: 76px;
    padding: 6px 12px 7px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(10, 9, 12, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.hud__stat--right {
    align-items: flex-end;
}

.hud__stat span {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--gold);
    opacity: 0.9;
}

.hud__stat b {
    font: 700 20px/1.15 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: #fff;
}

.hud__actions {
    display: flex;
    gap: 6px;
    padding-top: 2px;
    pointer-events: auto;
}

.icon-btn {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: rgba(10, 9, 12, 0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--cream);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
}

.icon-btn:active {
    transform: scale(0.9);
}

.icon-btn.is-off {
    opacity: 0.5;
}

/* ---------------- Кнопка прыжка (тач) ---------------- */

.jump-btn {
    position: fixed;
    right: calc(18px + var(--safe-r));
    bottom: calc(18px + var(--safe-b));
    z-index: 6;
    width: 86px;
    height: 86px;
    display: none;
    place-items: center;
    border: 2px solid rgba(255, 206, 92, 0.55);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255, 206, 92, 0.28), rgba(10, 9, 12, 0.62));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: var(--cream);
    font: 800 11px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.08em;
    cursor: pointer;
    touch-action: none;
}

.jump-btn:active {
    transform: scale(0.94);
    background: radial-gradient(circle at 35% 30%, rgba(255, 206, 92, 0.5), rgba(10, 9, 12, 0.7));
}

@media (pointer: coarse) {
    .jump-btn {
        display: grid;
    }
}

/* ---------------- Экраны ---------------- */

.screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(16px + var(--safe-b)) calc(16px + var(--safe-l));
    background: radial-gradient(130% 95% at 50% 0%, rgba(28, 16, 8, 0.28), rgba(5, 5, 8, 0.84));
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    overflow: hidden;
}

.card {
    width: min(100%, 430px);
    max-height: 100%;
    padding: clamp(20px, 4.5vw, 32px);
    border: 1px solid var(--line);
    border-radius: 26px;
    background: var(--panel);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    text-align: center;
    animation: card-in 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    overflow-y: auto;
}

.card--loader {
    width: min(100%, 320px);
}

@keyframes card-in {
    from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

.brand {
    margin: 0 0 14px;
    font: 700 10px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.85;
}

.title {
    margin: 0 0 10px;
    font-size: clamp(34px, 10vw, 54px);
    line-height: 0.94;
    font-weight: 900;
    letter-spacing: -0.035em;
    text-wrap: balance;
}

.title span {
    color: var(--gold);
    text-shadow: 0 0 34px rgba(255, 206, 92, 0.28);
}

.subtitle {
    margin: 0 0 16px;
    font-size: clamp(13px, 3.6vw, 15px);
    line-height: 1.4;
    color: rgba(255, 246, 229, 0.62);
}

.best-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 18px;
    padding: 7px 15px;
    border: 1px solid rgba(255, 206, 92, 0.28);
    border-radius: 999px;
    background: rgba(255, 206, 92, 0.09);
    font-size: 13px;
    color: rgba(255, 246, 229, 0.8);
}

.best-pill b {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
}

/* ---------------- Кнопки ---------------- */

.btn {
    display: block;
    width: 100%;
    min-height: 54px;
    margin-top: 10px;
    padding: 0 20px;
    border: 0;
    border-radius: 16px;
    font: 800 16px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
}

.btn:active {
    transform: scale(0.975);
}

.btn--primary {
    color: #241405;
    background: linear-gradient(135deg, var(--gold) 0%, var(--orange) 100%);
    box-shadow: 0 12px 30px rgba(255, 122, 47, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.45);
}

.btn--primary:hover {
    filter: brightness(1.06);
}

.btn--ghost {
    color: rgba(255, 246, 229, 0.7);
    background: transparent;
    border: 1px solid var(--line);
    font-size: 14px;
    min-height: 46px;
}

.btn--ghost:hover {
    color: var(--cream);
    background: rgba(255, 255, 255, 0.05);
}

.hint {
    margin: 16px 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(255, 246, 229, 0.42);
}

/* ---------------- Статистика ---------------- */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 6px 0 18px;
}

.stats--single {
    grid-template-columns: 1fr;
}

.stats > div {
    padding: 12px 8px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.04);
}

.stats span {
    display: block;
    margin-bottom: 5px;
    font: 700 9px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 246, 229, 0.45);
}

.stats b {
    font: 800 clamp(26px, 8vw, 34px)/1 ui-monospace, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
}

.record {
    display: inline-block;
    margin: 0 0 16px;
    padding: 8px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--gold), var(--orange));
    color: #241405;
    font: 800 12px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: 0.04em;
    animation: record-pulse 1.4s ease-in-out infinite;
}

@keyframes record-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
}

/* ---------------- Загрузка ---------------- */

.loader {
    height: 8px;
    margin: 4px 0 12px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
}

.loader i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--orange), var(--gold));
    transition: width 0.2s ease;
}

.loader__pct {
    margin: 0;
    font: 700 12px/1 ui-monospace, Menlo, Consolas, monospace;
    color: rgba(255, 246, 229, 0.5);
    font-variant-numeric: tabular-nums;
}

/* ---------------- Мелочи ---------------- */

@media (max-height: 480px) {
    .card {
        padding: 16px 20px;
        border-radius: 20px;
    }
    .brand {
        margin-bottom: 8px;
    }
    .title {
        font-size: clamp(26px, 7vh, 40px);
        margin-bottom: 6px;
    }
    .subtitle {
        margin-bottom: 10px;
        font-size: 12px;
    }
    .best-pill {
        margin-bottom: 10px;
        padding: 5px 12px;
    }
    .btn {
        min-height: 44px;
    }
    .hint {
        margin-top: 10px;
    }
    .jump-btn {
        width: 68px;
        height: 68px;
        font-size: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
    }
}

    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div class="hud" id="hud" hidden>
        <div class="hud__stat">
            <span>СЧЁТ</span>
            <b id="scoreVal">0</b>
            <i class="hud__speed" id="speedVal">x1.0</i>
        </div>
        <div class="hud__actions">
            <button class="icon-btn" id="soundBtn" type="button" aria-label="Звук">🔊</button>
            <button class="icon-btn" id="pauseBtn" type="button" aria-label="Пауза">⏸</button>
            <button class="icon-btn" id="fsBtn" type="button" aria-label="Во весь экран">⛶</button>
        </div>
        <div class="hud__stat hud__stat--right">
            <span>РЕКОРД</span>
            <b id="bestVal">0</b>
        </div>
    </div>

    <!-- Кнопка прыжка для тача -->
    <button class="jump-btn" id="jumpBtn" type="button" aria-label="Прыжок"><span>ПРЫЖОК</span></button>

    <!-- Загрузка -->
    <div class="screen" id="loadingScreen">
        <div class="card card--loader">
            <p class="brand">LEGENDS OF MANZAN</p>
            <div class="loader"><i id="loadBar"></i></div>
            <p class="loader__pct" id="loadPct">0%</p>
        </div>
    </div>

    <!-- Меню -->
    <div class="screen" id="menuScreen" hidden>
        <div class="card">
            <p class="brand">LEGENDS OF MANZAN</p>
            <h1 class="title">ЗА 5 МИНУТ<br><span>ДО ЭФИРА</span></h1>
            <p class="subtitle">Париж. Один забор. Ноль шансов.</p>
            <div class="best-pill">🏆 Рекорд <b id="menuBest">0</b></div>
            <button class="btn btn--primary" id="playBtn" type="button">ИГРАТЬ</button>
            <p class="hint">Пробел / ↑ / тап — прыжок · P — пауза</p>
        </div>
    </div>

    <!-- Конец игры -->
    <div class="screen" id="overScreen" hidden>
        <div class="card">
            <p class="brand">GAME OVER</p>
            <div class="record" id="recordBadge" hidden>🏆 Новый рекорд</div>
            <div class="stats">
                <div><span>Счёт</span><b id="overScore">0</b></div>
                <div><span>Рекорд</span><b id="overBest">0</b></div>
            </div>
            <button class="btn btn--primary" id="againBtn" type="button">ЕЩЁ РАЗ</button>
            <button class="btn btn--ghost" id="menuBtn" type="button">В МЕНЮ</button>
        </div>
    </div>

    <!-- Пауза -->
    <div class="screen" id="pauseScreen" hidden>
        <div class="card">
            <p class="brand">ПАУЗА</p>
            <div class="stats stats--single">
                <div><span>Счёт</span><b id="pauseScore">0</b></div>
            </div>
            <button class="btn btn--primary" id="resumeBtn" type="button">ПРОДОЛЖИТЬ</button>
            <button class="btn btn--ghost" id="pauseMenuBtn" type="button">В МЕНЮ</button>
        </div>
    </div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const $ = (id) => document.getElementById(id);
        const el = {
            hud: $('hud'),
            score: $('scoreVal'),
            best: $('bestVal'),
            speed: $('speedVal'),
            sound: $('soundBtn'),
            pause: $('pauseBtn'),
            fs: $('fsBtn'),
            jump: $('jumpBtn'),
            loading: $('loadingScreen'),
            loadBar: $('loadBar'),
            loadPct: $('loadPct'),
            menu: $('menuScreen'),
            menuBest: $('menuBest'),
            play: $('playBtn'),
            over: $('overScreen'),
            overScore: $('overScore'),
            overBest: $('overBest'),
            record: $('recordBadge'),
            again: $('againBtn'),
            menuBtn: $('menuBtn'),
            pauseScreen: $('pauseScreen'),
            pauseScore: $('pauseScore'),
            resume: $('resumeBtn'),
            pauseMenu: $('pauseMenuBtn'),
        };
        
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        const pixelRatio = window.devicePixelRatio || 1;
        
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen().catch(() => {});
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        }
        
        // ============================================================
        //  ПУТИ К ФАЙЛАМ — МЕНЯЙ ЗДЕСЬ
        // ============================================================
        const OBSTACLE_IMAGE          = "boss1.png";
        const OBSTACLE_BROKEN_IMAGE   = "broken.png";
        const OBSTACLE_FRAGMENT_IMAGE = "osk.png";
        
        // ============================================================
        
        const CONFIG = {
            GROUND_Y_PERCENT: 68,
            JUMP_HEIGHT_PERCENT: 28,
            // Ускорение свободного падения в пикселях в секунду^2.
            // Без этого параметра jumpVelocity становился NaN, и персонаж

            GRAVITY_PX_PER_SEC2: 2200,
            PLAYER_WIDTH_PERCENT: 18,
            PLAYER_HEIGHT_PERCENT: 26,
            PLAYER_X_PERCENT: 8,
            PLAYER_Y_OFFSET_PERCENT: 5,
            HITBOX_WIDTH_PERCENT: 45,
            HITBOX_HEIGHT_PERCENT: 85,
            HITBOX_OFFSET_X_PERCENT: 12,
            HITBOX_OFFSET_Y_PERCENT: 0,
            
            // ============ ПРЕПЯТСТВИЕ ============
            OBSTACLE_SIZE_PERCENT: 18,
            OBSTACLE_Y_OFFSET_PERCENT: 5,
            OBSTACLE_HITBOX_W_PERCENT: 65,
            OBSTACLE_HITBOX_H_PERCENT: 65,
            OBSTACLE_HITBOX_OFFSET_X_PERCENT: 18,
            OBSTACLE_HITBOX_OFFSET_Y_PERCENT: -3,
            
            // Безопасный зазор (страховка от сближения на высокой скорости)
            OBSTACLE_MIN_TIME_GAP_SEC: 1.2,
            OBSTACLE_MIN_GAP_PX: 480,
            OBSTACLE_MAX_ON_SCREEN: 4,
            
            // ============ СКОРОСТЬ (главное для «ускорения всего») ============
            BASE_SPEED_PX_PER_SEC: 480,
            MAX_SPEED_PX_PER_SEC: 1560,
            SPEED_ACCEL_PX_PER_SEC2: 180,
            SCORE_SPEED_INCREASE: 100,       // каждые 100 очков — новый уровень скорости
            SPEED_PER_SCORE_LEVEL: 60,       // +60 px/s за уровень
            
            SCORE_PER_SECOND: 2,
            SCORE_PER_OBSTACLE: 15,
            SCORE_PER_OBSTACLE_PASS: 10,
            
            // ============ СПАВН (редкий и постоянный) ============
            SPAWN_BASE_RATE_FRAMES: 40,
            SPAWN_RATE_REDUCTION: 3,
            SPAWN_CHANCE: 0.55,
            
            GRASS_HEIGHT_PERCENT: 28,
            GRASS_SPEED_MULT: 0.8,
            UI_FONT_SIZE_PERCENT: 1.2,
            UI_PANEL_WIDTH_PERCENT: 5,
            GAMEOVER_FONT_SIZE_PERCENT: 2,
            GAMEOVER_BTN_WIDTH_PERCENT: 28,
            GAMEOVER_BTN_HEIGHT_PERCENT: 7,
            
            BACKGROUND_OBJECTS: {
                ENABLED: true,
                SPAWN_CHANCE_PER_FRAME: 0.005,
                MIN_DISTANCE: 1600,
                MAX_OBJECTS: 2,
            },
            
            FRAGMENT_COUNT: 8,
            DEATH_DELAY_SECONDS: 1.4,
            FRAGMENT_GRAVITY: 1400,
            FRAGMENT_LIFE: 2.8,
        };
        
        const MAX_DT = 0.1;
        const RUN_ANIM_FRAME_TIME = 6 / 60;
        const RECORD_NOTIF_DURATION = 2.0;
        
        const BG_OBJECTS_CONFIG = [
            { type: "static", image: "manz/zabor.png",   sizePercent: 14, sinkPercent: 25, speedMult: 0.6, spawnWeight: 1,   name: "Забор" },
            { type: "static", image: "manz/вышка.png",   sizePercent: 45, sinkPercent: 6,  speedMult: 0.6, spawnWeight: 0.5, name: "Вышка" },

        ];
        
        const GRASS_TEXTURE_IMAGE = "manz/grass_z.png";
        const RUN_FRAMES = ["manz/1.png", "manz/2.png", "manz/3.png", "manz/4.png"];
        const JUMP_SPRITE = "manz/jump.png";
        const PARIS_BG_IMAGE = "manz/back.jpg";
        const MUSIC_FILE = "french meme song.mp3";
        const RECORD_SOUND = "manz/record.mp3";
        const JUMP_SOUNDS = ["manz/jump1.mp3", "manz/jump2.mp3"];
        const DEATH_SOUNDS = ["manz/death1.mp3", "manz/death3.mp3"];
        
        let screenWidth = 0, screenHeight = 0;
        let groundY = 0;
        let jumpVelocity = 0;
        let currentSpeed = 0;
        
        let playerWidth = 0, playerHeight = 0;
        let playerX = 0, playerYBase = 0;
        let hitboxW = 0, hitboxH = 0, hitboxX = 0, hitboxY = 0;
        
        let obstacleSize = 0;
        let obstacleYOffset = 0;
        let obstacleHitboxW = 0, obstacleHitboxH = 0, obstacleHitboxX = 0, obstacleHitboxY = 0;
        
        let grassHeight = 0, grassWidth = 0, textureOffset = 0;
        
        let uiFontSize = 0, uiPanelWidth = 0;
        let gameOverFontSize = 0, gameOverBtnW = 0, gameOverBtnH = 0;
        
        let gameStarted = false;
        let gameRunning = true;
        let paused = false;

        let shake = 0;
        let shownScore = -1;
        let shownBest = -1;
        let shownSpeed = '';
        let score = 0;
        let highScore = 0;
        try {
            highScore = parseInt(localStorage.getItem('ribHighScore'), 10) || 0;
        } catch (e) {
            highScore = 0;
        }
        
        let isJumping = false;
        let yPos = 0;
        let yVelocity = 0;
        let pendingJump = false;
        
        let currentRunFrame = 0;
        let runAnimTimer = 0;
        let obstacles = [];
        
        let fragments = [];
        let breakingObstacles = [];
        let deathTimer = 0;
        
        let grassTexture = null;
        let runImages = [];
        let jumpImage = null;
        let ribImage = null;
        let brokenObstacleImage = null;
        let fragmentImage = null;
        let brokenLoaded = false;
        let fragmentLoaded = false;
        
        let parisBackground = new Image();
        let backgroundLoaded = false;
        let grassTextureLoaded = false;
        
        let soundEnabled = true;
        let musicEnabled = true;
        let bgMusic = null;
        let recordSound = null;
        let jumpSounds = [];
        let deathSounds = [];
        
        let loadedCount = 0;
        let showHitboxes = false;
        let showRecordNotification = false;
        let recordNotificationTimer = 0;
        
        let bgObjectsData = [];
        let bgObjectsList = [];
        let bgObjectsReady = false;
        
        function calculateTotalToLoad() {
            let total = RUN_FRAMES.length + 4;
            total += 1;
            if (OBSTACLE_FRAGMENT_IMAGE && OBSTACLE_FRAGMENT_IMAGE !== "") total += 1;
            if (CONFIG.BACKGROUND_OBJECTS.ENABLED) {
                for (const obj of BG_OBJECTS_CONFIG) {
                    total += obj.type === "static" ? 1 : obj.frames.length;
                }
            }
            return total;
        }
        const totalToLoad = calculateTotalToLoad();
        
        function imageLoaded() {
            if (++loadedCount >= totalToLoad) bgObjectsReady = true;
            updateLoadingUi();
        }
        
        function updateLoadingUi() {
            const pct = Math.min(100, Math.round(loadedCount / totalToLoad * 100));
            if (el.loadBar) el.loadBar.style.width = pct + '%';
            if (el.loadPct) el.loadPct.textContent = pct + '%';
            
            if (loadedCount >= totalToLoad && !assetsReady) {
                assetsReady = true;
                el.menuBest.textContent = String(highScore);
                showScreen(el.menu);
                updateChrome();
            }
        }
        
        for (const src of RUN_FRAMES) {
            const img = new Image();
            img.onload = img.onerror = imageLoaded;
            img.src = src;
            runImages.push(img);
        }
        
        jumpImage = new Image();
        jumpImage.onload = jumpImage.onerror = imageLoaded;
        jumpImage.src = JUMP_SPRITE;
        
        ribImage = new Image();
        ribImage.onload = () => {
            if (ribImage.naturalWidth > 0) {
                console.log("✅ Целое препятствие загружено:", OBSTACLE_IMAGE,
                            ribImage.naturalWidth + "×" + ribImage.naturalHeight);
            }
            imageLoaded();
        };
        ribImage.onerror = () => {
            console.warn("⚠️ 404 — НЕ найден файл:", OBSTACLE_IMAGE);
            imageLoaded();
        };
        ribImage.src = OBSTACLE_IMAGE;
        
        brokenObstacleImage = new Image();
        brokenObstacleImage.onload = () => {
            if (brokenObstacleImage.naturalWidth > 0) {
                brokenLoaded = true;
                console.log("✅ Разбитая картинка загружена:", OBSTACLE_BROKEN_IMAGE,
                            brokenObstacleImage.naturalWidth + "×" + brokenObstacleImage.naturalHeight);
            }
            imageLoaded();
        };
        brokenObstacleImage.onerror = () => {
            brokenLoaded = false;
            console.warn("⚠️ 404 — НЕ найден файл:", OBSTACLE_BROKEN_IMAGE);
            imageLoaded();
        };
        brokenObstacleImage.src = OBSTACLE_BROKEN_IMAGE;
        
        if (OBSTACLE_FRAGMENT_IMAGE && OBSTACLE_FRAGMENT_IMAGE !== "") {
            fragmentImage = new Image();
            fragmentImage.onload = () => {
                if (fragmentImage.naturalWidth > 0) {
                    fragmentLoaded = true;
                    console.log("✅ Осколок загружен:", OBSTACLE_FRAGMENT_IMAGE,
                                fragmentImage.naturalWidth + "×" + fragmentImage.naturalHeight);
                }
                imageLoaded();
            };
            fragmentImage.onerror = () => {
                fragmentLoaded = false;
                console.warn("⚠️ 404 — НЕ найден файл осколка:", OBSTACLE_FRAGMENT_IMAGE);
                imageLoaded();
            };
            fragmentImage.src = OBSTACLE_FRAGMENT_IMAGE;
        } else {
            fragmentImage = brokenObstacleImage;
            fragmentLoaded = brokenLoaded;
        }
        
        parisBackground.onload = () => { backgroundLoaded = true; imageLoaded(); };
        parisBackground.onerror = () => { backgroundLoaded = false; imageLoaded(); };
        parisBackground.src = PARIS_BG_IMAGE;
        
        grassTexture = new Image();
        grassTexture.onload = () => { grassTextureLoaded = true; imageLoaded(); };
        grassTexture.onerror = () => { grassTextureLoaded = false; imageLoaded(); };
        grassTexture.src = GRASS_TEXTURE_IMAGE;
        
        loadBackgroundObjects();
        
        function loadBackgroundObjects() {
            if (!CONFIG.BACKGROUND_OBJECTS.ENABLED) { bgObjectsReady = true; return; }
            for (const config of BG_OBJECTS_CONFIG) {
                if (config.type === "static") {
                    const img = new Image();
                    img.onload = img.onerror = imageLoaded;
                    img.src = config.image;
                    bgObjectsData.push({ type: "static", image: img, config });
                } else if (config.type === "animated") {
                    const frames = [];
                    for (const f of config.frames) {
                        const fi = new Image();
                        fi.onload = fi.onerror = imageLoaded;
                        fi.src = f;
                        frames.push(fi);
                    }
                    bgObjectsData.push({
                        type: "animated", frames, config,
                        currentFrame: 0, frameTimer: 0
                    });
                }
            }
        }
        
        function resizeCanvas() {
            const oldW = screenWidth || window.innerWidth;
            screenWidth = window.innerWidth;
            screenHeight = window.innerHeight;
            
            canvas.width = Math.round(screenWidth * pixelRatio);
            canvas.height = Math.round(screenHeight * pixelRatio);
            canvas.style.width = screenWidth + 'px';
            canvas.style.height = screenHeight + 'px';
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(pixelRatio, pixelRatio);
            
            recalcSizes();
            
            if (oldW > 0 && oldW !== screenWidth && gameStarted) {
                const sx = screenWidth / oldW;
                for (const o of obstacles) o.x *= sx;
                for (const o of bgObjectsList) o.x *= sx;
                for (const o of breakingObstacles) o.x *= sx;
                for (const o of fragments) o.x *= sx;
            }
        }
        
        function recalcPhysics() {
            const jumpHeightPx = screenHeight * (CONFIG.JUMP_HEIGHT_PERCENT / 100);
            jumpVelocity = Math.sqrt(2 * CONFIG.GRAVITY_PX_PER_SEC2 * jumpHeightPx);
        }
        
        function recalcSizes() {
            groundY = screenHeight * (CONFIG.GROUND_Y_PERCENT / 100);
            playerWidth = screenHeight * (CONFIG.PLAYER_WIDTH_PERCENT / 100);
            playerHeight = screenHeight * (CONFIG.PLAYER_HEIGHT_PERCENT / 100);
            playerX = screenWidth * (CONFIG.PLAYER_X_PERCENT / 100);
            const playerYOffset = screenHeight * (CONFIG.PLAYER_Y_OFFSET_PERCENT / 100);
            playerYBase = groundY - playerHeight + playerYOffset;
            
            hitboxW = playerWidth * (CONFIG.HITBOX_WIDTH_PERCENT / 100);
            hitboxH = playerHeight * (CONFIG.HITBOX_HEIGHT_PERCENT / 100);
            hitboxX = playerWidth * (CONFIG.HITBOX_OFFSET_X_PERCENT / 100);
            hitboxY = (playerHeight - hitboxH) + playerHeight * (CONFIG.HITBOX_OFFSET_Y_PERCENT / 100);
            
            obstacleSize = screenHeight * (CONFIG.OBSTACLE_SIZE_PERCENT / 100);
            obstacleYOffset = screenHeight * (CONFIG.OBSTACLE_Y_OFFSET_PERCENT / 100);
            
            obstacleHitboxW = obstacleSize * (CONFIG.OBSTACLE_HITBOX_W_PERCENT / 100);
            obstacleHitboxH = obstacleSize * (CONFIG.OBSTACLE_HITBOX_H_PERCENT / 100);
            obstacleHitboxX = obstacleSize * (CONFIG.OBSTACLE_HITBOX_OFFSET_X_PERCENT / 100);
            obstacleHitboxY = obstacleSize * (CONFIG.OBSTACLE_HITBOX_OFFSET_Y_PERCENT / 100);
            
            grassHeight = screenHeight * (CONFIG.GRASS_HEIGHT_PERCENT / 100);
            grassWidth = grassHeight * 1.5;
            
            uiFontSize = Math.max(14, screenWidth * (CONFIG.UI_FONT_SIZE_PERCENT / 100));
            uiPanelWidth = screenWidth * (CONFIG.UI_PANEL_WIDTH_PERCENT / 100);
            gameOverFontSize = screenWidth * (CONFIG.GAMEOVER_FONT_SIZE_PERCENT / 100);
            gameOverBtnW = screenWidth * (CONFIG.GAMEOVER_BTN_WIDTH_PERCENT / 100);
            gameOverBtnH = screenHeight * (CONFIG.GAMEOVER_BTN_HEIGHT_PERCENT / 100);
            
            recalcPhysics();
            
            for (const obj of bgObjectsList) obj.updateSize();
            for (const obs of obstacles) obs.size = obstacleSize;
        }
        
        class BackgroundObject {
            constructor(xPos, objectData) {
                this.x = xPos;
                this.objectData = objectData;
                this.width = 0;
                this.height = 0;
                this.updateSize();
            }
            updateSize() {
                const img = this.objectData.type === "static"
                    ? this.objectData.image : this.objectData.frames[0];
                if (!img || !img.complete || img.naturalWidth === 0) return;
                const base = screenHeight * (this.objectData.config.sizePercent / 100);
                this.height = base;
                this.width = base * (img.naturalWidth / img.naturalHeight);
            }
            getCurrentImage() {
                return this.objectData.type === "static"
                    ? this.objectData.image : this.objectData.frames[this.objectData.currentFrame];
            }
            updateAnimation(dt) {
                if (this.objectData.type !== "animated") return;
                const d = this.objectData;
                // Анимация ускоряется вместе со скоростью
                const animScale = Math.max(0.5, currentSpeed / CONFIG.BASE_SPEED_PX_PER_SEC);
                const ft = ((d.config.frameDelay || 2) / 60) / animScale;
                d.frameTimer += dt;
                while (d.frameTimer >= ft) {
                    d.frameTimer -= ft;
                    d.currentFrame = (d.currentFrame + 1) % d.frames.length;
                }
            }
            draw() {
                const img = this.getCurrentImage();
                if (!img || !img.complete || img.naturalWidth === 0) return;
                if (this.width === 0) this.updateSize();
                const sink = this.height * (this.objectData.config.sinkPercent / 100);
                const y = groundY - this.height + sink;
                ctx.drawImage(img, this.x, y, this.width, this.height);
            }
            update(dt) {
                this.updateAnimation(dt);
                this.x -= currentSpeed * this.objectData.config.speedMult * dt;
            }
            isOffscreen() { return this.x + this.width < 0; }
        }
        
        function spawnBackgroundObject(dt) {
            if (!CONFIG.BACKGROUND_OBJECTS.ENABLED || !bgObjectsReady) return;
            if (bgObjectsData.length === 0) return;
            if (bgObjectsList.length >= CONFIG.BACKGROUND_OBJECTS.MAX_OBJECTS) return;
            
            let lastX = -1000;
            for (const o of bgObjectsList) if (o.x > lastX) lastX = o.x;
            if (lastX + CONFIG.BACKGROUND_OBJECTS.MIN_DISTANCE > screenWidth) return;
            
            const probPerSec = CONFIG.BACKGROUND_OBJECTS.SPAWN_CHANCE_PER_FRAME * 60;
            if (Math.random() > Math.min(1, probPerSec * dt)) return;
            
            let totalW = 0;
            for (const o of bgObjectsData) totalW += o.config.spawnWeight;
            let r = Math.random() * totalW;
            let sel = bgObjectsData[0];
            for (const o of bgObjectsData) {
                r -= o.config.spawnWeight;
                if (r <= 0) { sel = o; break; }
            }
            bgObjectsList.push(new BackgroundObject(screenWidth + Math.random() * 150, sel));
        }
        
        function updateBackgroundObjects(dt) {
            for (let i = 0; i < bgObjectsList.length; i++) {
                bgObjectsList[i].update(dt);
                if (bgObjectsList[i].isOffscreen()) { bgObjectsList.splice(i, 1); i--; }
            }
            if (gameStarted && gameRunning) spawnBackgroundObject(dt);
        }
        
        function drawBackgroundObjects() {
            for (const o of bgObjectsList) o.draw();
        }
        
        function createAudio(url, loop = false, volume = 0.5) {
            if (!url) return null;
            try { const a = new Audio(); a.src = url; a.loop = loop; a.volume = volume; return a; }
            catch (e) { return null; }
        }
        function playRandomJumpSound() {
            if (!soundEnabled || !gameStarted) return;
            const s = jumpSounds[Math.floor(Math.random() * jumpSounds.length)];
            if (s) { s.currentTime = 0; s.play().catch(() => {}); }
        }
        function playRandomDeathSound() {
            if (!soundEnabled) return;
            const s = deathSounds[Math.floor(Math.random() * deathSounds.length)];
            if (s) { s.currentTime = 0; s.play().catch(() => {}); }
        }
        function startMusic() {
            if (bgMusic && musicEnabled && soundEnabled && gameStarted && gameRunning)
                bgMusic.play().catch(() => {});
        }
        function stopMusic() {
            if (bgMusic) { bgMusic.pause(); bgMusic.currentTime = 0; }
        }
        function toggleMusic() {
            musicEnabled = !musicEnabled;
            if (musicEnabled && gameStarted && gameRunning) startMusic();
            else stopMusic();
        }
        function initSounds() {
            bgMusic = createAudio(MUSIC_FILE, true, 0.18);
            recordSound = createAudio(RECORD_SOUND, false, 0.7);
            JUMP_SOUNDS.forEach(s => { const a = createAudio(s, false, 0.5); if (a) jumpSounds.push(a); });
            DEATH_SOUNDS.forEach(s => { const a = createAudio(s, false, 0.6); if (a) deathSounds.push(a); });
        }
        
        function drawHitbox(x, y, w, h, color = "rgba(255,0,0,0.4)") {
            if (!showHitboxes) return;
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }
        
        class Ribs {
            constructor(xPos) {
                this.x = xPos;
                this.size = obstacleSize;
                this.passed = false;
            }
            draw() {
                const y = groundY - this.size + obstacleYOffset;
                if (ribImage && ribImage.complete && ribImage.naturalWidth > 0) {
                    ctx.drawImage(ribImage, this.x, y, this.size, this.size);
                } else {
                    ctx.fillStyle = "#ffaa66";
                    ctx.fillRect(this.x, y, this.size, this.size);
                }
                const hb = this.getHitboxRect();
                drawHitbox(hb.x, hb.y, hb.w, hb.h, "rgba(0,255,0,0.45)");
            }
            update(dt) { this.x -= currentSpeed * dt; }
            getHitboxRect() {
                return {
                    x: this.x + obstacleHitboxX,
                    y: groundY - obstacleHitboxH + obstacleHitboxY + obstacleYOffset,
                    w: obstacleHitboxW,
                    h: obstacleHitboxH
                };
            }
        }
        
        class Fragment {
            constructor(x, y, vx, vy, size) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.size = size;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 12;
                this.life = CONFIG.FRAGMENT_LIFE;
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += CONFIG.FRAGMENT_GRAVITY * dt;
                this.vx *= (1 - 0.5 * dt);
                this.rotation += this.rotSpeed * dt;
                this.life -= dt;
            }
            draw() {
                if (this.life <= 0) return;
                const alpha = Math.min(1, this.life / 0.4);
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                let img = null;
                if (fragmentLoaded && fragmentImage && fragmentImage.complete
                    && fragmentImage.naturalWidth > 0) {
                    img = fragmentImage;
                } else if (brokenLoaded && brokenObstacleImage && brokenObstacleImage.complete
                           && brokenObstacleImage.naturalWidth > 0) {
                    img = brokenObstacleImage;
                } else if (ribImage && ribImage.complete && ribImage.naturalWidth > 0) {
                    img = ribImage;
                }
                
                if (img) {
                    ctx.drawImage(img, -this.size/2, -this.size/2, this.size, this.size);
                } else {
                    ctx.fillStyle = "#ff00ff";
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                }
                ctx.restore();
            }
            isDead() { return this.life <= 0; }
        }
        
        class BreakingObstacle {
            constructor(x, y, size, lifeSeconds) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.timer = lifeSeconds;
            }
            update(dt) { this.timer -= dt; }
            draw() {
                if (this.timer <= 0) return;
                
                let img = null;
                let tintRed = false;
                if (brokenLoaded && brokenObstacleImage && brokenObstacleImage.complete
                    && brokenObstacleImage.naturalWidth > 0) {
                    img = brokenObstacleImage;
                } else if (ribImage && ribImage.complete && ribImage.naturalWidth > 0) {
                    img = ribImage;
                    tintRed = true;
                }
                
                if (img) {
                    ctx.drawImage(img, this.x, this.y, this.size, this.size);
                    if (tintRed) {
                        ctx.globalAlpha = 0.55;
                        ctx.fillStyle = "#ff2200";
                        ctx.fillRect(this.x, this.y, this.size, this.size);
                        ctx.globalAlpha = 1;
                    }
                } else {
                    ctx.fillStyle = "#ff00ff";
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                    ctx.fillStyle = "#fff";
                    ctx.font = `bold ${Math.floor(this.size * 0.15)}px monospace`;
                    ctx.textAlign = "center";
                    ctx.fillText("NO", this.x + this.size/2, this.y + this.size/2 - 2);
                    ctx.fillText("IMG", this.x + this.size/2, this.y + this.size/2 + this.size*0.18);
                    ctx.textAlign = "left";
                }
            }
            isDead() { return this.timer <= 0; }
        }
        
        function breakObstacle(obs) {
            const obsY = groundY - obs.size + obstacleYOffset;
            breakingObstacles.push(
                new BreakingObstacle(obs.x, obsY, obs.size, CONFIG.DEATH_DELAY_SECONDS)
            );
            
            const cx = obs.x + obs.size / 2;
            const cy = obsY + obs.size / 2;
            const fragSize = obs.size * 0.22;
            
            for (let i = 0; i < CONFIG.FRAGMENT_COUNT; i++) {
                const angle = (Math.PI * 2 * i) / CONFIG.FRAGMENT_COUNT + (Math.random() - 0.5) * 0.7;
                const speed = 350 + Math.random() * 450;
                fragments.push(new Fragment(
                    cx + (Math.random() - 0.5) * obs.size * 0.4,
                    cy + (Math.random() - 0.5) * obs.size * 0.4,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed - 250,
                    fragSize * (0.7 + Math.random() * 0.8)
                ));
            }
        }
        
        function spawnObstacle() {
            const timeGapPx = currentSpeed * CONFIG.OBSTACLE_MIN_TIME_GAP_SEC;
            const dynamicGap = Math.max(CONFIG.OBSTACLE_MIN_GAP_PX, timeGapPx);
            
            if (obstacles.length === 0) {
                obstacles.push(new Ribs(screenWidth));
            } else {
                const last = obstacles[obstacles.length - 1];
                if (last.x < screenWidth - dynamicGap) obstacles.push(new Ribs(screenWidth));
            }
        }
        
        function checkCollisionHit() {
            const px = playerX + hitboxX;
            const py = playerYBase + yPos + hitboxY;
            for (const obs of obstacles) {
                const o = obs.getHitboxRect();
                if (px < o.x + o.w && px + hitboxW > o.x &&
                    py < o.y + o.h && py + hitboxH > o.y) {
                    return obs;
                }
            }
            return null;
        }
        
        function updateEffects(dt) {
            for (let i = fragments.length - 1; i >= 0; i--) {
                fragments[i].update(dt);
                if (fragments[i].isDead()) { fragments.splice(i, 1); }
            }
            for (let i = breakingObstacles.length - 1; i >= 0; i--) {
                breakingObstacles[i].update(dt);
                if (breakingObstacles[i].isDead()) { breakingObstacles.splice(i, 1); }
            }
            if (!gameRunning && deathTimer > 0) deathTimer -= dt;
            if (showRecordNotification && !gameRunning && deathTimer <= 0) {
                recordNotificationTimer -= dt;
                if (recordNotificationTimer <= 0) showRecordNotification = false;
            }
        }
        
        function drawEffects() {
            for (const b of breakingObstacles) b.draw();
            for (const f of fragments) f.draw();
        }
        
        function drawParisBackground() {
            if (backgroundLoaded && parisBackground.complete && parisBackground.naturalWidth > 0) {
                ctx.drawImage(parisBackground, 0, 0, screenWidth, groundY);
            } else {
                const g = ctx.createLinearGradient(0, 0, 0, groundY);
                g.addColorStop(0, "#87CEEB");
                g.addColorStop(1, "#B0E0FF");
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, screenWidth, groundY);
            }
        }
        
        function drawGrass() {
            if (grassTextureLoaded && grassTexture && grassTexture.complete) {
                const startY = groundY - 5;
                for (let y = 0; y < screenHeight - startY + grassHeight; y += grassHeight) {
                    for (let x = -grassWidth; x <= screenWidth + grassWidth; x += grassWidth) {
                        ctx.drawImage(grassTexture, x + textureOffset, startY + y, grassWidth, grassHeight);
                    }
                }
            } else {
                ctx.fillStyle = "#2d6a2d";
                ctx.fillRect(0, groundY, screenWidth, screenHeight - groundY);
            }
        }
        
        function drawPlayer() {
            const x = playerX;
            const y = playerYBase + yPos;
            let img = null;
            if (isJumping) img = jumpImage;
            else if (runImages.length && runImages[currentRunFrame]?.complete) img = runImages[currentRunFrame];
            
            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath();
            ctx.ellipse(x + playerWidth/2, playerYBase + yPos + playerHeight - 6,
                playerWidth/2.2, playerHeight/12, 0, 0, Math.PI*2);
            ctx.fill();
            
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, x, y, playerWidth, playerHeight);
            } else {
                ctx.fillStyle = "#ffcc88";
                ctx.fillRect(x, y, playerWidth, playerHeight);
            }
            drawHitbox(x + hitboxX, y + hitboxY, hitboxW, hitboxH, "rgba(255,0,0,0.45)");
        }
        
        function draw() {
            ctx.save();
            
            // Тряска камеры при смерти
            if (shake > 0) {
                const m = shake * 10;
                ctx.translate((Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m);
            }
            
            drawParisBackground();
            drawGrass();
            drawBackgroundObjects();
            for (const obs of obstacles) obs.draw();
            drawEffects();
            drawPlayer();
            
            ctx.restore();
        }
        
        function updateGame(dt) {
            if (!gameStarted || paused) return;
            
            updateEffects(dt);
            
            if (!gameRunning) return;
            
            if (pendingJump && !isJumping && yPos >= 0) {
                isJumping = true;
                yVelocity = -jumpVelocity;
                playRandomJumpSound();
            }
            pendingJump = false;
            
            if (isJumping) {
                yPos += yVelocity * dt;
                yVelocity += CONFIG.GRAVITY_PX_PER_SEC2 * dt;
                if (yPos >= 0) { yPos = 0; isJumping = false; yVelocity = 0; }
            }
            
            // Анимация бега — ускоряется с currentSpeed
            if (!isJumping && runImages.length > 0) {
                const animScale = Math.max(0.5, currentSpeed / CONFIG.BASE_SPEED_PX_PER_SEC);
                const frameTime = RUN_ANIM_FRAME_TIME / animScale;
                runAnimTimer += dt;
                while (runAnimTimer >= frameTime) {
                    runAnimTimer -= frameTime;
                    currentRunFrame = (currentRunFrame + 1) % runImages.length;
                }
            }
            
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                obs.update(dt);
                if (obs.x + obs.size < 0) {
                    obstacles.splice(i, 1); i--;
                    score += CONFIG.SCORE_PER_OBSTACLE;
                    continue;
                }
                if (!obs.passed && obs.x + obs.size/2 < playerX) {
                    obs.passed = true;
                    score += CONFIG.SCORE_PER_OBSTACLE_PASS;
                }
            }
            
            // Скорость — level-up каждые 100 очков, +60 px/s за уровень
            const speedLevel = Math.floor(score / CONFIG.SCORE_SPEED_INCREASE);
            let target = CONFIG.BASE_SPEED_PX_PER_SEC + speedLevel * CONFIG.SPEED_PER_SCORE_LEVEL;
            if (target > CONFIG.MAX_SPEED_PX_PER_SEC) target = CONFIG.MAX_SPEED_PX_PER_SEC;
            if (currentSpeed < target) currentSpeed = Math.min(target, currentSpeed + CONFIG.SPEED_ACCEL_PX_PER_SEC2 * dt);
            
            // Спавн — оригинальная формула (редкий и постоянный)
            const speedOld = currentSpeed / 60;
            const spawnRateFrames = Math.max(CONFIG.SPAWN_BASE_RATE_FRAMES, 130 - Math.floor(speedOld * CONFIG.SPAWN_RATE_REDUCTION));
            const spawnPerSec = (60 / spawnRateFrames) * CONFIG.SPAWN_CHANCE;
            if (obstacles.length < CONFIG.OBSTACLE_MAX_ON_SCREEN
                && Math.random() < Math.min(1, spawnPerSec * dt)) {
                spawnObstacle();
            }
            
            updateBackgroundObjects(dt);
            
            if (grassTextureLoaded) {
                const dx = currentSpeed * CONFIG.GRASS_SPEED_MULT * dt;
                textureOffset = ((textureOffset - dx) % grassWidth + grassWidth) % grassWidth;
            }
            
            score += CONFIG.SCORE_PER_SECOND * dt;
            
            const hit = checkCollisionHit();
            if (hit) {
                gameRunning = false;
                overShown = false;
                deathTimer = CONFIG.DEATH_DELAY_SECONDS;
                shake = 0.3;
                playRandomDeathSound();
                stopMusic();
                updateChrome();
                
                obstacles = obstacles.filter(o => o !== hit);
                breakObstacle(hit);
                
                let prev = 0;
                try {
                    prev = parseInt(localStorage.getItem('ribHighScore'), 10) || 0;
                } catch (err) {
                    prev = 0;
                }
                if (Math.floor(score) > prev) {
                    highScore = Math.floor(score);
                    try {
                        localStorage.setItem('ribHighScore', highScore);
                    } catch (err) {}
                    showRecordNotification = true;
                    recordNotificationTimer = RECORD_NOTIF_DURATION;
                    setTimeout(() => {
                        if (recordSound && soundEnabled && !gameRunning) {
                            recordSound.currentTime = 0;
                            recordSound.play().catch(() => {});
                        }
                    }, 500);
                }
                
                // Даём осколкам и тряске отыграть, затем показываем финал
                setTimeout(() => {
                    if (!gameRunning && gameStarted && !paused) showGameOver();
                }, CONFIG.DEATH_DELAY_SECONDS * 1000 + 60);
            }
        }
        
        function showScreen(screen) {
            for (const s of [el.loading, el.menu, el.over, el.pauseScreen]) {
                if (s) s.hidden = true;
            }
            if (screen) screen.hidden = false;
        }
        
        function updateChrome() {
            const playing = gameStarted && gameRunning && !paused;
            el.sound.textContent = soundEnabled ? '🔊' : '🔇';
            el.sound.classList.toggle('is-off', !soundEnabled);
            el.pause.hidden = !(playing || paused);
            el.pause.textContent = paused ? '▶' : '⏸';
            el.pause.setAttribute('aria-label', paused ? 'Продолжить' : 'Пауза');
            el.jump.hidden = !playing;
            el.menuBest.textContent = String(highScore);
        }
        
        function updateHud() {
            const v = Math.floor(score);
            if (v !== shownScore) {
                shownScore = v;
                el.score.textContent = String(v);
            }
            const b = Math.max(highScore, v);
            if (b !== shownBest) {
                shownBest = b;
                el.best.textContent = String(b);
            }
            const sp = 'x' + (currentSpeed / CONFIG.BASE_SPEED_PX_PER_SEC).toFixed(1);
            if (sp !== shownSpeed) {
                shownSpeed = sp;
                el.speed.textContent = sp;
            }
        }
        
        function showGameOver() {
            if (overShown || gameRunning || !gameStarted) return;
            overShown = true;
            deathTimer = 0;
            el.overScore.textContent = String(Math.floor(score));
            el.overBest.textContent = String(highScore);
            el.record.hidden = !showRecordNotification;
            showScreen(el.over);
            updateChrome();
        }
        
        function restartGame() {
            gameStarted = true;
            gameRunning = true;
            paused = false;
            overShown = false;
            deathTimer = 0;
            shake = 0;
            score = 0;
            obstacles = [];
            bgObjectsList = [];
            fragments = [];
            breakingObstacles = [];
            isJumping = false;
            yPos = 0;
            yVelocity = 0;
            pendingJump = false;
            runAnimTimer = 0;
            currentRunFrame = 0;
            showRecordNotification = false;
            recordNotificationTimer = 0;
            currentSpeed = CONFIG.BASE_SPEED_PX_PER_SEC;
            
            showScreen(null);
            el.hud.hidden = false;
            updateChrome();
            updateHud();
            
            if (musicEnabled && soundEnabled) startMusic();
        }
        
        function startGame() {
            if (gameStarted) return;
            requestFullscreen();
            restartGame();
        }
        
        function toMenu() {
            stopMusic();
            gameStarted = false;
            gameRunning = true;
            paused = false;
            overShown = false;
            deathTimer = 0;
            shake = 0;
            score = 0;
            obstacles = [];
            bgObjectsList = [];
            fragments = [];
            breakingObstacles = [];
            isJumping = false;
            yPos = 0;
            yVelocity = 0;
            pendingJump = false;
            currentSpeed = CONFIG.BASE_SPEED_PX_PER_SEC;
            
            el.hud.hidden = true;
            el.menuBest.textContent = String(highScore);
            showScreen(el.menu);
            updateChrome();
        }
        
        function pauseGame() {
            if (!gameStarted || !gameRunning || paused) return;
            paused = true;
            stopMusic();
            el.pauseScore.textContent = String(Math.floor(score));
            showScreen(el.pauseScreen);
            updateChrome();
        }
        
        function resumeGame() {
            if (!paused) return;
            paused = false;
            showScreen(null);
            updateChrome();
            if (musicEnabled && soundEnabled) startMusic();
        }
        
        function toggleSound() {
            soundEnabled = !soundEnabled;
            musicEnabled = soundEnabled;
            if (!soundEnabled) stopMusic();
            else if (gameStarted && gameRunning && !paused) startMusic();
            updateChrome();
        }
        
        function jump() {
            if (!gameStarted || !gameRunning || paused) return;
            if (!isJumping && yPos >= 0) pendingJump = true;
        }
        
        function handleCanvasTap(e) {
            if (e) e.preventDefault();
            if (gameStarted && gameRunning && !paused) jump();
        }
        
        window.addEventListener('resize', () => {
            clearTimeout(window._rt);
            window._rt = setTimeout(resizeCanvas, 100);
        });
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
        
        canvas.addEventListener('pointerdown', handleCanvasTap);
        
        // Кнопки интерфейса
        el.play.addEventListener('click', startGame);
        el.again.addEventListener('click', restartGame);
        el.menuBtn.addEventListener('click', toMenu);
        el.resume.addEventListener('click', resumeGame);
        el.pauseMenu.addEventListener('click', toMenu);
        el.sound.addEventListener('click', toggleSound);
        el.pause.addEventListener('click', () => {
            if (paused) resumeGame();
            else pauseGame();
        });
        el.fs.addEventListener('click', async () => {
            try {
                if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
                else await document.exitFullscreen();
            } catch (err) {}
        });
        el.jump.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            jump();
        });
        
        // Тап по свободному месту на оверлее
        function overlayTap(screen, action) {
            screen.addEventListener('pointerdown', (e) => {
                if (e.target.closest('button')) return;
                e.preventDefault();
                action();
            });
        }
        overlayTap(el.menu, startGame);
        overlayTap(el.over, restartGame);
        overlayTap(el.pauseScreen, resumeGame);
        
        document.addEventListener('keydown', (e) => {
            // Хитбоксы — только клавишей O
            if (e.key === 'o' || e.key === 'O') { e.preventDefault(); showHitboxes = !showHitboxes; return; }
            
            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                if (gameStarted && gameRunning) {
                    e.preventDefault();
                    if (paused) resumeGame(); else pauseGame();
                }
                return;
            }
            
            if (e.key === 'm' || e.key === 'M') {
                e.preventDefault();
                toggleSound();
                return;
            }
            
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'Space' || e.key === 'w' || e.key === 'W') {
                e.preventDefault();
                if (!gameStarted) startGame();
                else if (paused) resumeGame();
                else if (gameRunning) jump();
                else if (overShown) restartGame();
                return;
            }
            
            if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                if (!gameStarted) startGame(); else restartGame();
            }
        });
        
        document.addEventListener('visibilitychange', () => {
            lastTime = performance.now();
            if (document.hidden && gameStarted && gameRunning && !paused) pauseGame();
        });
        
        initSounds();
        resizeCanvas();
        updateLoadingUi();
        updateChrome();
        updateHud();
        
        let lastTime = performance.now();
        
        function gameLoop(now) {
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if (!isFinite(dt) || dt < 0) dt = 0;
            if (dt > MAX_DT) dt = MAX_DT;
            
            if (shake > 0) shake = Math.max(0, shake - dt);
            
            updateGame(dt);
            draw();
            updateHud();
            requestAnimationFrame(gameLoop);
        }
        window.__idx2 = {
            start: startGame,
            restart: restartGame,
            pause: pauseGame,
            resume: resumeGame,
            menu: toMenu,
            forceDeath: (pts) => {
                if (typeof pts === 'number') score = pts;
                obstacles.push(new Ribs(playerX - obstacleSize * 0.35));
            },
            state: () => ({
                gameStarted, gameRunning, paused, overShown, deathTimer, shake,
                score: Math.floor(score), highScore,
                screen: el.loading.hidden ? (el.menu.hidden ? (el.over.hidden ? (el.pauseScreen.hidden ? 'playing' : 'paused') : 'over') : 'menu') : 'loading',
                hud: !el.hud.hidden,
                music: musicEnabled, sound: soundEnabled,
                loadedCount, totalToLoad,
            }),
        };
        
        requestAnimationFrame(gameLoop);
    })();
</script>
